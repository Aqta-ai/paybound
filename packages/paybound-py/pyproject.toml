[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paybound"
version = "0.1.0"
description = "Paybound: let AI agents pay on BNB Smart Chain only what a person approved. Testnet only, not audited."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["web3>=6.15,<8"]
keywords = ["bnb", "bsc", "ai-agent", "agent-payments", "web3", "smart-contract", "aqta", "seal"]
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://paybound-eight.vercel.app"
Source = "https://github.com/Aqta-ai/paybound"

[tool.setuptools.package-data]
paybound = ["contracts.json"]
